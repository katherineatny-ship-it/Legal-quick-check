function courtOf(county,dist){if(!county) return ''; if(WHOLE[county]) return WHOLE[county]; const s=SPLIT[county]; if(!s||!dist) return ''; for(const k in s) if(s[k].includes(dist)) return k; return '';}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function parseROC(s){if(!s)return null;s=String(s).trim().replace(/[年月]/g,'/').replace(/日/,'');let m=s.match(/^(\d{2,3})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/)||s.match(/^(\d{2,3})(\d{2})(\d{2})$/);if(!m)return null;const d=new Date(+m[1]+1911,+m[2]-1,+m[3]);return d.getMonth()===+m[2]-1?d:null;}
const roc=d=>(d.getFullYear()-1911)+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate());
function addM(d,n){const x=new Date(d),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x;}
function addLim(d,L){if(L.u==='d'){const x=new Date(d);x.setDate(x.getDate()+L.n);return x;} return addM(d,L.u==='m'?L.n:L.n*12);}
function left(d){const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000);}

function result(C,sel,keys){
 let h='<section class="card res"><h2>⑤ 判斷結果</h2>';
 /* 時效 */
 h+='<h3>時效</h3>';
 sel.forEach(([b,i])=>{const L=LIM[b.lim]; const d=parseROC(st.start[i]); let r='';

  else r='<span class="muted">輸入起算日即可計算</span>';
  h+=`<div class="row"><div><b>${esc(b.n)}</b><small>${esc(L.t)}（${esc(L.law)}）</small></div><div>${r}</div></div>`;});
 /* 管轄 */
 h+='<h3>管轄法院</h3>';
 const ex=keys.filter(k=>JUR[k].ex), list=[];
 (ex.length?ex:keys).forEach(k=>{const J=JUR[k]; const cn=courtName(J.loc); list.push({cn,why:J.t,law:J.law,ex:J.ex});});
 if(!ex.length&&st.agree==='有'){const a=st.loc.agree||{}; const c=courtOf(a.c,a.d); list.push({cn:c?COURT_FULL(c):'',why:'合意管轄（應以文書證之；屬「排他」或「併存」合意，依約定文字判斷）',law:'民事訴訟法第24條'});}
 h+=list.map(x=>`<div class="row"><div><b>${x.cn?esc(x.cn):'<span class="muted">（請於④選擇地點）</span>'}</b>${x.ex?' <span class="tag r">專屬</span>':''}<small>${esc(x.why)}｜${esc(x.law)}</small></div></div>`).join('');
 const uniq=[...new Set(list.map(x=>x.cn).filter(Boolean))];
 if(uniq.length&&!ex.length) h+=`<div class="hint">數法院俱有管轄權時，原告得任向其中一法院起訴（民事訴訟法第22條）。被告數人住所不同者，各該住所地法院俱有管轄權（第20條）。</div>`;
 if(uniq.length) h+=`<div class="hint">上訴審：${uniq.map(c=>{const k=c.replace(/^臺灣|^福建|地方法院$/g,''); return esc(c)+' → '+esc(highOf(k)||'');}).join('；')}</div>`;
 if(st.role==='被告') h+=`<div class="hint">被告如認法院無管轄權，應於本案言詞辯論前抗辯；不抗辯而為本案言詞辯論者，以該法院為有管轄權（民事訴訟法第25條，專屬管轄除外）。</div>`;
 /* 程序 */
 h+='<h3>適用程序</h3>';
 const amt=+String(st.amt).replace(/[^\d]/g,''); const money=sel.some(([b])=>b.money); const simp=sel.map(([b])=>b.simp).filter(Boolean);
 let proc='', why='';
 if(simp.length){proc='簡易程序'; why='不問金額適用簡易程序：'+[...new Set(simp)].map(k=>SIMP[k]).join('、')+'（民事訴訟法第427條第2項）';}
 if(amt){ if(money&&amt<=100000){proc='小額程序'; why='請求給付金錢等，標的金額 10 萬元以下（民事訴訟法第436條之8）';}
  else if(!proc&&amt<=500000){proc='簡易程序'; why='財產權訴訟，標的金額或價額 50 萬元以下（民事訴訟法第427條第1項）';}
  else if(!proc){proc='通常程序'; why='標的金額或價額逾 50 萬元';}
  else if(proc==='簡易程序'&&amt>5000000) why+='；標的逾 500 萬元且案情繁雜者，法院得依聲請改用通常程序（第427條第5項）';}
 if(!proc) proc='（請輸入金額或價額）';
 h+=`<div class="row"><div><b>${esc(proc)}</b><small>${esc(why)}</small></div></div>`;

 else if(amt&&amt<=500000) h+='<div class="row"><div><b>應先經法院調解</b><small>其他財產權爭執，標的金額或價額 50 萬元以下（民事訴訟法第403條第1項第11款）</small></div></div>';
 else h+='<div class="row"><div><span class="muted">非應先行調解事件（仍得聲請調解）</span></div></div>';
